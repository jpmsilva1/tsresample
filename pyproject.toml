[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsresample"
dynamic = ["version"]
description = "Resampling strategies for imbalanced time series forecasting (Moniz, Branco & Torgo, 2017)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["imbalanced", "time-series", "resampling", "smote", "forecasting", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

# Layer 1 only. pandas is deliberately NOT here -- see Blueprint/docs/adr/0010.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
io = ["pandas>=2.0"]
dev = [
    "tsresample[io]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
tsresample = "tsresample.pipeline.cli:main"

[tool.hatch.version]
path = "src/tsresample/__init__.py"

[tool.hatch.build.targets.sdist]
# Library only: Blueprint/ (verification data, ~80 MB) never ships to PyPI.
# tests/ are left out too: they read oracles from Blueprint/.
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/tsresample"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
markers = [
    "replication: end-to-end gate G4; needs TSRESAMPLE_REPLICATION_ROOT",
    "slow: takes more than a few seconds",
]
addopts = "--strict-markers --doctest-modules"

[tool.coverage.run]
source = ["tsresample"]

[tool.coverage.report]
# The coverage floor. Stated in Blueprint/docs/SPEC.md §6 and Blueprint/ops/QUALITY_GATES.md §1.
# CI reads it from here -- do not hardcode it in a workflow file.
fail_under = 90

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# Neither ships type information; adding stub packages is not worth a dev dep.
module = ["scipy.*", "sklearn.*", "pandas.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"
# Blueprint/ is the verification kit (probes, fixtures), not library code.
extend-exclude = ["Blueprint"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "NPY", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The report is Markdown for humans: rho, Delta and the minus sign are intended.
"tests/test_replication.py" = ["RUF001", "RUF002"]

[tool.ruff.lint.pep8-naming]
# SPEC notation: X (sklearn feature matrix), N (total cases), t_R (threshold).
extend-ignore-names = ["X", "X*", "N", "t_R"]
